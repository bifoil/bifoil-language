# Supply authentication through SONAR_TOKEN; keep tokens outside repository files.
sonar.projectKey=bifoil_bifoil-language
sonar.organization=bifoil
sonar.sourceEncoding=UTF-8
sonar.scanner.autoconfig.enabled=false
sonar.working.directory=.bifoil/development/sonar/scanner-work
# Bifoil source fixtures are checked by the native conformance runner, not a Sonar language analyzer.
sonar.sources=tools
sonar.tests=tools,conformance
sonar.test.inclusions=tools/test_*.py,conformance/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=.bifoil/development/sonar/python-coverage.xml
